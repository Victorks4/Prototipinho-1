<html lang="pt-br">
<head>
    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles-fixed.css" />
    <link rel="stylesheet" href="public/hemobyte-styles.css" />
    <link rel="stylesheet" href="public/ux-fixes.css" />
    <link rel="stylesheet" href="header-fix.css" />
    <link rel="stylesheet" href="login-background.css" />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    />
</head>
<body>
    <!-- Skip link para acessibilidade -->
    <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>
    
    <header class="top-header" role="banner">
        <div class="logo-container">
            <a href="index.html" class="logo-link" aria-label="HemoByte - Voltar ao início">
                <i class="fas fa-tint" aria-hidden="true"></i>
                <span class="logo-text">HemoByte</span>
            </a>
        </div>

        <nav class="main-nav" role="navigation" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html" title="Início">
                    <i class="fas fa-home" aria-hidden="true"></i>
                    <span class="sr-only">Início</span>
                </a></li>
                <li><a href="campanhas-ativas.html" title="Campanhas">
                    <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                    <span class="sr-only">Campanhas</span>
                </a></li>
                <li><a href="criar-campanha.html" title="Criar Campanha">
                    <i class="fas fa-plus-circle" aria-hidden="true"></i>
                    <span class="sr-only">Criar Campanha</span>
                </a></li>
                <li><a href="sobre.html" title="Sobre">
                    <i class="fas fa-info-circle" aria-hidden="true"></i>
                    <span class="sr-only">Sobre</span>
                </a></li>
                <li><a href="login.html" class="active" title="Login" aria-current="page">
                    <i class="fas fa-user" aria-hidden="true"></i>
                    <span class="sr-only">Login</span>
                </a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" class="login-page" role="main">
        
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-tabs" role="tablist" aria-label="Opções de autenticação">
                    <button class="tab-link active" data-tab="login" role="tab" aria-selected="true" aria-controls="login-form" id="login-tab">
                        <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Login
                    </button>
                    <button class="tab-link" data-tab="cadastro" role="tab" aria-selected="false" aria-controls="cadastro-form" id="cadastro-tab">
                        <i class="fas fa-user-plus" aria-hidden="true"></i> Cadastrar
                    </button>
                </div>

                <!-- Formulário de Login -->
                <form id="login-form" class="auth-form active" role="tabpanel" aria-labelledby="login-tab" data-loading="false" data-validation="login" data-validation-endpoint="validation-server.php?type=login">
                    <div class="form-group">
                        <label for="login-email"><i class="fas fa-envelope" aria-hidden="true"></i> Email</label>
                        <input id="login-email" name="email" type="email" placeholder="Digite seu email" required aria-describedby="email-help" autocomplete="email" />
                        <div id="email-help" class="form-hint">Usado para login e recuperação de senha</div>
                    </div>

                    <div class="form-group">
                        <label for="login-senha"><i class="fas fa-lock" aria-hidden="true"></i> Senha</label>
                        <input id="login-senha" name="senha" type="password" placeholder="Digite sua senha" required aria-describedby="senha-help" autocomplete="current-password" />
                        <div id="senha-help" class="form-hint">Mínimo 8 caracteres</div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="lembrar" />
                            <span>Lembrar-me</span>
                        </label>
                        <a href="#" class="forgot-password">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn-auth" data-loading="false" aria-describedby="login-submit-desc">
                        <span class="btn-text">
                            <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Entrar
                        </span>
                        <span class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Entrando...
                        </span>
                    </button>
                    <div id="login-submit-desc" class="sr-only">Clique para fazer login no sistema</div>
                </form>

                <!-- Formulário de Cadastro -->
                <form id="cadastro-form" class="auth-form" data-validation="cadastro" data-validation-endpoint="validation-server.php?type=cadastro">
                    <div class="form-group">
                        <label for="cadastro-nome"><i class="fas fa-user"></i> Nome Completo</label>
                        <input id="cadastro-nome" name="nome" type="text" placeholder="Digite seu nome completo" required />
                    </div>

                    <div class="form-group">
                        <label for="cadastro-email"><i class="fas fa-envelope"></i> Email</label>
                        <input id="cadastro-email" name="email" type="email" placeholder="Digite seu email" required />
                    </div>

                    <div class="form-group">
                        <label for="cadastro-telefone"><i class="fas fa-phone"></i> Telefone</label>
                        <input
                            id="cadastro-telefone"
                            name="telefone"
                            type="tel"
                            placeholder="(00) 00000-0000"
                            required
                            maxlength="15"
                        />
                    </div>

                    <div class="form-group">
                        <label for="cadastro-senha"><i class="fas fa-lock"></i> Senha</label>
                        <input id="cadastro-senha" name="senha" type="password" placeholder="Digite sua senha" required />
                    </div>

                    <div class="form-group">
                        <label for="cadastro-confirmar-senha"><i class="fas fa-lock"></i> Confirmar Senha</label>
                        <input
                            id="cadastro-confirmar-senha"
                            name="confirmar_senha"
                            type="password"
                            placeholder="Confirme sua senha"
                            required
                        />
                    </div>

                    <button type="submit" class="btn-auth">
                        <i class="fas fa-user-plus"></i> Cadastrar
                    </button>
                </form>
            </div>

            <div class="auth-links">
                <p>
                    Precisa de ajuda? <a href="https://wa.me/75981829675" target="_blank"><i class="fab fa-whatsapp"></i> Fale
                        Conosco</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <a href="index.html" class="footer-logo">
                <i class="fas fa-tint"></i>
                <span>HemoByte</span>
            </a>
            <nav class="footer-links">
                <a href="campanhas-ativas.html">Campanhas</a>
                <a href="sobre.html">Sobre</a>
                <a href="https://wa.me/75981829675"><i class="fab fa-whatsapp"></i></a>
            </nav>
        </div>
    </footer>

    <!-- ✅ SISTEMA LIMPO DE LOGIN -->
    <script src="public/auth-system.js"></script>
    <script src="public/login-system.js"></script>
    <script>
        // Alternar entre abas Login e Cadastro
        const tabLinks = document.querySelectorAll(".tab-link");
        const forms = document.querySelectorAll(".auth-form");

        tabLinks.forEach((link) => {
            link.addEventListener("click", () => {
                tabLinks.forEach((l) => l.classList.remove("active"));
                forms.forEach((f) => f.classList.remove("active"));

                link.classList.add("active");

                const tab = link.getAttribute("data-tab");
                if (tab === "login") {
                    document.getElementById("login-form").classList.add("active");
                } else if (tab === "cadastro") {
                    document.getElementById("cadastro-form").classList.add("active");
                }
            });
        });

        // Máscara simples para telefone brasileiro
        const telefoneInput = document.getElementById("cadastro-telefone");
        if (telefoneInput) {
            telefoneInput.addEventListener("input", (e) => {
                let x = e.target.value.replace(/\D/g, "").substring(0, 11);
                let formatted = "";

                if (x.length > 0) {
                    formatted += "(" + x.substring(0, 2);
                }
                if (x.length >= 3) {
                    formatted += ") " + x.substring(2, 7);
                }
                if (x.length >= 8) {
                    formatted += "-" + x.substring(7, 11);
                }

                e.target.value = formatted;
            });
        }

        // Se quiser já abrir direto no cadastro pela URL (#cadastro)
        if (window.location.hash === "#cadastro") {
            tabLinks.forEach((l) => l.classList.remove("active"));
            forms.forEach((f) => f.classList.remove("active"));

            document.querySelector('[data-tab="cadastro"]').classList.add("active");
            document.getElementById("cadastro-form").classList.add("active");
        }
    </script>
</body>
</html>
